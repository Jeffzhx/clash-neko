name: Daily Sync

# 单仓方案：源码与产物都在 Jeffzhx/clash-neko（公开仓）。
# 每天定时抓取 GitHub 低星源的美国优质节点，生成双格式订阅并就地提交到本仓 main，
# 由 jsDelivr 分发。也可在 Actions 页手动触发。
on:
  push:
    branches: [main]      # 推送到 main 时自动重建订阅
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC（北京时间 11:00）
  workflow_dispatch:      # 手动触发

# 就地 push 需要写权限；内置 GITHUB_TOKEN 即可，无需自建 PAT。
permissions:
  contents: write

concurrency:
  group: daily-subscription-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # timeout-minutes 是 job 级键（不能放顶层）；防止卡住的探测拖垮整次运行。
    timeout-minutes: 25
    steps:
      # persist-credentials 默认 true：把 GITHUB_TOKEN 写入本地 git 配置，最后的 push 才能用。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare env
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml maxminddb

      # geoip_filter.py 的 mmdb 路径由 GEOIP_MMDB 覆盖（未设时回退本机 D: 路径，仅本地用）。
      # GeoLite2-Country 官方站需 license key，默认用公开镜像；可在仓库 Variables 里设 MMDB_URL 覆盖。
      - name: Prepare data
        run: |
          set -euo pipefail
          URL="${{ vars.MMDB_URL }}"
          if [ -z "$URL" ]; then
            URL="https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb"
          fi
          echo "Downloading mmdb from mirror..."
          for i in 1 2 3; do
            if curl -fsSL --retry 2 --max-time 120 "$URL" -o "$RUNNER_TEMP/Country.mmdb"; then
              echo "mmdb downloaded (try $i)"
              break
            fi
            [ "$i" -eq 3 ] && { echo "mmdb download failed after 3 tries" >&2; exit 1; }
            sleep 10
          done
          ls -l "$RUNNER_TEMP/Country.mmdb"
          echo "GEOIP_MMDB=$RUNNER_TEMP/Country.mmdb" >> "$GITHUB_ENV"

      # 下载 mihomo 内核用于协议级测活（真实 hysteria2 握手 + HTTP 请求）。
      # 版本可用 Variables MIHOMO_VERSION 覆盖；下载失败不阻断——测活步骤会降级到端口级。
      - name: Prepare tools
        run: |
          set -uo pipefail
          V="${{ vars.MIHOMO_VERSION }}"
          [ -z "$V" ] && V="v1.19.34"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/${V}"
          ok=0
          for name in "mihomo-linux-amd64-compatible-${V}.gz" "mihomo-linux-amd64-${V}.gz"; do
            if curl -fsSL --retry 2 --max-time 120 "${BASE}/${name}" -o "$RUNNER_TEMP/mihomo.gz"; then
              gunzip -f "$RUNNER_TEMP/mihomo.gz"
              chmod +x "$RUNNER_TEMP/mihomo"
              "$RUNNER_TEMP/mihomo" -v 2>&1 | head -1 || true
              echo "MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
              echo "MIHOMO_VERSION=${V}" >> "$GITHUB_ENV"
              echo "mihomo downloaded (${name})"
              ok=1
              break
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "::warning::mihomo download failed; liveness will fall back to port-level TCP/UDP"
          fi
          # 必须显式 exit 0：下载成功时 ok=1，若最后一条命令是 `[ ok -eq 0 ] && echo`
          # 会因条件为假返回退出码 1，被 GitHub 误判为步骤失败（2026-11-20 CI 实测踩坑）。
          exit 0

      # 抓取阶段用 GITHUB_TOKEN 提额到 5000/h（token 只在内存用，经 env 注入，不落盘）。
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_sources.py

      # GeoIP / 美国判定（GEOIP_MMDB 由上一步注入）
      - name: Filter
        run: python scripts/geoip_filter.py

      # 测活：内核优先（协议级真实握手）；内核缺失/启动失败(退出码2)自动降级到端口级 TCP/UDP。
      # 全失败按红线生成空列表。
      - name: Verify
        run: |
          set -uo pipefail
          python scripts/kernel_probe.py
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "kernel probe unavailable (rc=2); falling back to port-level liveness_check.py"
            python scripts/liveness_check.py
          elif [ "$rc" -ne 0 ]; then
            echo "kernel probe failed unexpectedly (rc=$rc)" >&2
            exit "$rc"
          fi

      # 双格式订阅输出（同一批节点，main.yaml + nekobox.json）
      - name: Generate
        run: python scripts/build_subscriptions.py

      # 校验产物结构后再提交，避免把坏文件推上去
      - name: Check
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          a = open('main.yaml', encoding='utf-8').read()
          b = open('nekobox.json', encoding='utf-8').read()
          y = yaml.safe_load(a)
          z = yaml.safe_load(b)
          for name, doc in (('main.yaml', y), ('nekobox.json', z)):
              assert isinstance(doc, dict) and isinstance(doc.get('proxies'), list), f'{name} bad'
          assert a == b, 'subscription addresses out of sync'
          print(f'validated: proxies={len(y["proxies"])} (single format, both addresses identical)')
          PY

      # 单仓就地提交： commit message 带时间戳头部；无变化则跳过，避免空提交。
      # 用内置 GITHUB_TOKEN（checkout 已 persist），无需 PUBLISH_TOKEN。
      - name: Publish
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.yaml nekobox.json probe/geoip-report.md probe/liveness-report.md probe/subscription-build-report.md
          if git diff --cached --quiet; then
            echo "No changes to publish; skipping commit"
          else
            git commit -m "[auto ${TS}] daily subscription update [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Published to ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          fi
