name: Daily Sync

# 双分支方案：源码在 main，产物在 gh-pages（公开仓 Jeffzhx/clash-neko）。
# 每天定时任务在 main 上生成产物，最后只 push 到 gh-pages 分支——main 永不被机器人写入，
# 避免本地改代码 push 时与 CI 产物提交冲突。jsDelivr 走 @gh-pages 分发。
# on.push 只监听 main：产物 push 到 gh-pages 不会触发本 workflow（无循环）。
on:
  push:
    branches: [main]      # 源码推送到 main 时自动重建
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC（北京时间 11:00）
  workflow_dispatch:      # 手动触发

# 就地 push 需要写权限；内置 GITHUB_TOKEN 即可，无需自建 PAT。
permissions:
  contents: write

concurrency:
  group: daily-subscription-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # timeout-minutes 是 job 级键（不能放顶层）；防止卡住的探测拖垮整次运行。
    timeout-minutes: 25
    steps:
      # persist-credentials 默认 true：把 GITHUB_TOKEN 写入本地 git 配置，最后的 push 才能用。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0   # 全量历史：Publish 需切换/创建 gh-pages 分支并保留其历史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare env
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml maxminddb

      # geoip_filter.py 的 mmdb 路径由 GEOIP_MMDB 覆盖（未设时回退本机 D: 路径，仅本地用）。
      # GeoLite2-Country 官方站需 license key，默认用公开镜像；可在仓库 Variables 里设 MMDB_URL 覆盖。
      - name: Prepare data
        run: |
          set -euo pipefail
          URL="${{ vars.MMDB_URL }}"
          if [ -z "$URL" ]; then
            URL="https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb"
          fi
          echo "Downloading mmdb from mirror..."
          for i in 1 2 3; do
            if curl -fsSL --retry 2 --max-time 120 "$URL" -o "$RUNNER_TEMP/Country.mmdb"; then
              echo "mmdb downloaded (try $i)"
              break
            fi
            [ "$i" -eq 3 ] && { echo "mmdb download failed after 3 tries" >&2; exit 1; }
            sleep 10
          done
          ls -l "$RUNNER_TEMP/Country.mmdb"
          echo "GEOIP_MMDB=$RUNNER_TEMP/Country.mmdb" >> "$GITHUB_ENV"

      # 下载 mihomo 内核用于协议级测活（真实 hysteria2 握手 + HTTP 请求）。
      # 版本可用 Variables MIHOMO_VERSION 覆盖；下载失败不阻断——测活步骤会降级到端口级。
      - name: Prepare tools
        run: |
          set -uo pipefail
          V="${{ vars.MIHOMO_VERSION }}"
          [ -z "$V" ] && V="v1.19.34"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/${V}"
          ok=0
          for name in "mihomo-linux-amd64-compatible-${V}.gz" "mihomo-linux-amd64-${V}.gz"; do
            if curl -fsSL --retry 2 --max-time 120 "${BASE}/${name}" -o "$RUNNER_TEMP/mihomo.gz"; then
              gunzip -f "$RUNNER_TEMP/mihomo.gz"
              chmod +x "$RUNNER_TEMP/mihomo"
              "$RUNNER_TEMP/mihomo" -v 2>&1 | head -1 || true
              echo "MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
              echo "MIHOMO_VERSION=${V}" >> "$GITHUB_ENV"
              echo "mihomo downloaded (${name})"
              ok=1
              break
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "::warning::mihomo download failed; liveness will fall back to port-level TCP/UDP"
          fi
          # 必须显式 exit 0：下载成功时 ok=1，若最后一条命令是 `[ ok -eq 0 ] && echo`
          # 会因条件为假返回退出码 1，被 GitHub 误判为步骤失败（2026-11-20 CI 实测踩坑）。
          exit 0

      # 从产物分支恢复上次累积的 sources.json（双分支后源码 main 不保存它）。
      # 若 gh-pages 尚不存在（首次运行），保留 main 上的初始 sources.json 作为种子。
      - name: Restore state
        run: |
          set -uo pipefail
          # 显式 fetch gh-pages 远程跟踪 ref（checkout@v4 只保证当前分支，不保证其它分支 ref 存在）
          git fetch origin gh-pages 2>/dev/null || echo "no gh-pages branch yet (first run)"
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            if git cat-file -e origin/gh-pages:sources.json 2>/dev/null; then
              git show origin/gh-pages:sources.json > sources.json
              echo "restored sources.json from gh-pages"
            else
              echo "gh-pages has no sources.json yet; keep seed from main"
            fi
          else
            echo "gh-pages branch not found; keep seed from main (first run)"
          fi
          python -c "import json; d=json.load(open('sources.json')); print('sources:', d.get('count', len(d.get('repos', []))))"

      # 动态补充来源仓库（star 不限）：每天最多新增 N 个，已存在的按 full_name 去重不会重复加。
      # 发现失败/限流不阻断主流程；token 只在内存用。
      - name: Discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python scripts/discover_sources.py --max-new 15 || echo "::warning::source discovery failed; continue with existing sources"
          exit 0

      # 抓取阶段用 GITHUB_TOKEN 提额到 5000/h（token 只在内存用，经 env 注入，不落盘）。
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_sources.py

      # GeoIP / 美国判定（GEOIP_MMDB 由上一步注入）
      - name: Filter
        run: python scripts/geoip_filter.py

      # 测活：内核优先（协议级真实握手）；内核缺失/启动失败(退出码2)自动降级到端口级 TCP/UDP。
      # 全失败按红线生成空列表。
      - name: Verify
        run: |
          # GitHub Actions 默认用 `bash -e` 跑 run 脚本（即使在脚本里写 set -uo pipefail 也带 -e）。
          # 必须用 `|| rc=$?` 捕获退出码，否则 kernel_probe 返回 2 会直接中断、降级分支永远跑不到。
          # 实测：原写法 `python ...; rc=$?` 在 -e 下返回 2 立即退出（2026-11-20 CI 踩坑）。
          set -uo pipefail
          rc=0
          python scripts/kernel_probe.py || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "kernel probe unavailable (rc=2); falling back to port-level liveness_check.py"
            python scripts/liveness_check.py
          elif [ "$rc" -ne 0 ]; then
            echo "kernel probe failed unexpectedly (rc=$rc)" >&2
            exit "$rc"
          fi

      # 双格式订阅输出（同一批节点，main.yaml + nekobox.json）
      - name: Generate
        run: python scripts/build_subscriptions.py

      # 校验产物结构后再提交，避免把坏文件推上去
      - name: Check
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          a = open('main.yaml', encoding='utf-8').read()
          b = open('nekobox.json', encoding='utf-8').read()
          y = yaml.safe_load(a)
          z = yaml.safe_load(b)
          for name, doc in (('main.yaml', y), ('nekobox.json', z)):
              assert isinstance(doc, dict) and isinstance(doc.get('proxies'), list), f'{name} bad'
          assert a == b, 'subscription addresses out of sync'
          print(f'validated: proxies={len(y["proxies"])} (single format, both addresses identical)')
          PY

      # 产物发布到 gh-pages 分支（main 永不写入）。用临时 index + commit-tree 构建提交，
      # 不切换工作区（切换会丢弃上面生成的未提交产物），且保留 gh-pages 历史。
      # [skip ci] + on.push 只监听 main：双重保证 gh-pages 的 push 不会触发新 run。
      - name: Publish
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          export GIT_INDEX_FILE="$RUNNER_TEMP/ghpages.index"
          rm -f "$GIT_INDEX_FILE"

          # 刷新 gh-pages 远程 ref，基于最新 tip 构建（避免 non-fast-forward）
          git fetch origin gh-pages 2>/dev/null || true

          # 以现有 gh-pages tip 为基（首次则空树），保留历史
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git read-tree origin/gh-pages
            PARENT="$(git rev-parse origin/gh-pages)"
          else
            git read-tree --empty
            PARENT=""
          fi

          # 只把产物加入 gh-pages 的 index
          git add main.yaml nekobox.json sources.json probe/geoip-report.md probe/liveness-report.md probe/subscription-build-report.md probe/discover-report.md
          TREE="$(git write-tree)"

          # 与上次内容相同则跳过（避免空提交）
          if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "No changes to publish; skipping"
            unset GIT_INDEX_FILE
            exit 0
          fi

          if [ -n "$PARENT" ]; then
            COMMIT="$(git commit-tree "$TREE" -p "$PARENT" -m "[auto ${TS}] data sync [skip ci]")"
          else
            COMMIT="$(git commit-tree "$TREE" -m "[auto ${TS}] data sync [skip ci]")"
          fi
          unset GIT_INDEX_FILE

          git push origin "$COMMIT:refs/heads/gh-pages"
          echo "Published to ${GITHUB_REPOSITORY}@gh-pages (${COMMIT:0:8})"
